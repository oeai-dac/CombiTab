# Erzeugt die Installationspakete für alle Plattformen und hängt sie an einen
# Entwurf eines GitHub-Release.
#
# Auslösen durch einen Versions-Tag:
#     npm version 2.0.1        # setzt package.json und legt den Tag an
#     git push --follow-tags
#
# Das Release wird als ENTWURF angelegt: So lassen sich die Dateien vorher
# herunterladen und prüfen, und der Begleittext kann in Ruhe geschrieben werden.
# Erst das Veröffentlichen macht es für Nutzer sichtbar.
#
# Es wird bewusst NICHT signiert (weder Apple noch Windows) — siehe
# docs/INSTALLATION.md, das die Sicherheitsmeldungen erklärt. Sobald
# Zertifikate vorliegen, genügt es, hier die entsprechenden Secrets zu setzen;
# electron-builder greift sie selbsttätig auf.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux (AppImage, deb, rpm)
            command: npm run dist:linux -- --publish never
          - os: windows-latest
            label: Windows (Installer, portabel)
            command: npm run dist:win -- --publish never
          # Die macos-latest-Runner laufen selbst auf Apple Silicon, das dmg
          # entsteht also nativ für arm64. Für Intel-Macs wird bewusst kein
          # Paket gebaut — dort verweist die Anleitung auf die Web-Fassung.
          - os: macos-latest
            label: macOS (Apple Silicon)
            command: npm run dist:mac -- --publish never

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Das rpm-Ziel ruft `rpmbuild` auf, das auf dem Ubuntu-Runner nicht
      # vorinstalliert ist. Ohne diesen Schritt bricht der Linux-Bau ab,
      # nachdem AppImage und deb bereits fertig sind.
      - name: rpmbuild bereitstellen (nur Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Testsuite
        run: npm test

      # `--publish never` ist nicht optional: Sobald ein Tag im Spiel ist, will
      # electron-builder die Dateien von sich aus zu GitHub Releases hochladen
      # und bricht ohne GH_TOKEN ab — nachdem es die Pakete bereits fertig
      # gebaut hat. Das Veröffentlichen ist hier aber ausdrücklich Sache des
      # nachgelagerten Jobs, der einen einzigen Entwurf anlegt.
      - name: Installationspakete bauen
        run: ${{ matrix.command }}
        env:
          # Ohne Zertifikat gar nicht erst versuchen zu signieren.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Nur die auslieferbaren Dateien einsammeln — nicht das entpackte
      # Verzeichnis, das electron-builder daneben stehen lässt.
      #
      # Die .blockmap-Dateien bleiben bewusst draußen: electron-builder legt sie
      # für Delta-Downloads beim Auto-Update an, und CombiTab bietet kein
      # Auto-Update. Am Release hingen sie nur als erklärungsbedürftiger Ballast
      # neben den Paketen.
      - name: Pakete als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: pakete-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.exe
            release/*.dmg

  release:
    name: Release-Entwurf anlegen
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Alle Pakete herunterladen
        uses: actions/download-artifact@v4
        with:
          path: pakete
          merge-multiple: true

      - name: Übersicht
        run: ls -lh pakete

      - name: Entwurf mit angehängten Dateien
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: pakete/*
          body: |
            ## Installation

            Eine ausführliche, bebilderte Anleitung steht in
            [docs/INSTALLATION.md](https://github.com/oeai-dac/CombiTab/blob/main/docs/INSTALLATION.md).

            | System | Datei |
            |---|---|
            | Windows | `CombiTab-*-Setup-x64.exe` (Installer) oder `CombiTab-*-portable-x64.exe` (ohne Installation) |
            | macOS (Apple Silicon, M1–M4) | `CombiTab-*-arm64.dmg` |
            | Linux (universell) | `CombiTab-*-x86_64.AppImage` |
            | Debian, Ubuntu, Mint | `combitab_*_amd64.deb` |
            | Fedora, openSUSE, RHEL | `combitab-*.x86_64.rpm` |

            **Ohne Installation ausprobieren:** <https://oeai-dac.github.io/CombiTab/>

            > Die Pakete sind nicht digital signiert. Windows und macOS zeigen
            > deshalb beim ersten Start eine Warnung. Die Installationsanleitung
            > erklärt Schritt für Schritt, wie Sie sie bestätigen.
